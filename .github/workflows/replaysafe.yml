name: ReplaySafe

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - id: replaysafe
        continue-on-error: true
        run: replaysafe scan . --format sarif --fail-on high > replaysafe.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: replaysafe.sarif
      - if: steps.replaysafe.outcome == 'failure'
        run: exit 1

